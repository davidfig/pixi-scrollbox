<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pixi-scrollbox demo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/ascetic.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .titleCode {
            margin-top: 0.5em;
            margin-left: 15%;
            font-size: 2em;
        }

        #code {
            position: absolute;
            left: 15%;
            width: 80%;
            word-wrap: break-word;
            z-index: -1;
        }

        .hljs {
            display: block;
            overflow-x: auto;
            padding: 0.5em;
            background: rgba(0, 0, 100, 0.02);
        }

        .hljs-comment {
            color: blue;
        }

        .font {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-size: 1.25em;
        }
    </style>
    <script type="module" src="./code.js"></script>
</head>

<body>
    <div class="titleCode">Example for <a href="https://github.com/davidfig/pixi-scrollbox/">github.com/davidfig/pixi-scrollbox/</a></div>
    <pre><code class="language-javascript" id="code"></code></pre>
</body>
</html>
